<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="emblem-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="emblem-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="subtle-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <radialGradient id="ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="256" cy="256" r="240" fill="url(#ambient-glow)" />

  <!-- Outer Instrument Rim -->
  <circle cx="256" cy="256" r="236" stroke="url(#subtle-rim)" stroke-width="2" />
  <circle cx="256" cy="256" r="224" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />

  <!-- Compass / Calibrator Cardinal Indices -->
  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <!-- North -->
    <line x1="256" y1="28" x2="256" y2="48" />
    <!-- South -->
    <line x1="256" y1="464" x2="256" y2="484" />
    <!-- West -->
    <line x1="28" y1="256" x2="48" y2="256" />
    <!-- East -->
    <line x1="464" y1="256" x2="484" y2="256" />
  </g>

  <!-- Golden Angle Degree Markers -->
  <g stroke="#64748b" stroke-width="1" stroke-linecap="round" opacity="0.4">
    <line x1="95" y1="95" x2="108" y2="108" />
    <line x1="417" y1="95" x2="404" y2="108" />
    <line x1="95" y1="417" x2="108" y2="404" />
    <line x1="417" y1="417" x2="404" y2="404" />
  </g>

  <!-- Harmonic Resonance Ring System -->
  <circle cx="256" cy="256" r="190" stroke="url(#emblem-core)" stroke-width="2.5" opacity="0.85" />
  <circle cx="256" cy="256" r="150" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.5" />
  <circle cx="256" cy="256" r="115" stroke="url(#emblem-accent)" stroke-width="2" opacity="0.75" />

  <!-- Interlocking Cymatic Petals / Waveform Aperture -->
  <!-- 0 deg -->
  <path d="M 106 256 C 106 173 173 106 256 106 C 339 106 406 173 406 256" stroke="url(#emblem-core)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.95" />
  <!-- 180 deg -->
  <path d="M 406 256 C 406 339 339 406 256 406 C 173 406 106 339 106 256" stroke="url(#emblem-core)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.95" />

  <!-- 90 deg / Vertical Loop -->
  <path d="M 256 106 C 339 106 406 173 406 256 C 406 339 339 406 256 406" stroke="url(#emblem-accent)" stroke-width="2" stroke-dasharray="6 3" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 256 406 C 173 406 106 339 106 256 C 106 173 173 106 256 106" stroke="url(#emblem-accent)" stroke-width="2" stroke-dasharray="6 3" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Dual Lissajous Coherence Ribbon -->
  <path d="M 166 256 Q 256 146 346 256 Q 256 366 166 256 Z" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.85" filter="url(#bloom)" />
  <path d="M 256 166 Q 366 256 256 346 Q 146 256 256 166 Z" stroke="#a855f7" stroke-width="2.5" fill="none" opacity="0.85" filter="url(#bloom)" />

  <!-- Central Resonance Core -->
  <circle cx="256" cy="256" r="46" fill="#090d16" stroke="url(#emblem-core)" stroke-width="2.5" />
  <circle cx="256" cy="256" r="30" fill="url(#core-glow)" />
  <circle cx="256" cy="256" r="16" fill="#38bdf8" filter="url(#bloom)" />
  <circle cx="256" cy="256" r="7" fill="#ffffff" />

  <!-- Orbital Node Satellites -->
  <circle cx="166" cy="256" r="4" fill="#38bdf8" />
  <circle cx="346" cy="256" r="4" fill="#38bdf8" />
  <circle cx="256" cy="166" r="4" fill="#a855f7" />
  <circle cx="256" cy="346" r="4" fill="#a855f7" />
</svg>