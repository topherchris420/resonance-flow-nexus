<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sentinel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Rounded Tile for standalone favicon display -->
  <rect width="64" height="64" rx="14" fill="#090d16" />
  
  <!-- Subtle Background Grid/Aperture Rings -->
  <circle cx="32" cy="32" r="26" stroke="#1e293b" stroke-width="1" />
  <circle cx="32" cy="32" r="20" stroke="#334155" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />
  <circle cx="32" cy="32" r="14" stroke="url(#glow-grad)" stroke-width="1.2" opacity="0.8" />

  <!-- Harmonic Resonance Waveforms / Petals (Concentric Hexagonal Symmetry) -->
  <g transform="rotate(0 32 32)">
    <!-- Primary Outer Resonance Ring -->
    <circle cx="32" cy="32" r="23" stroke="url(#sentinel-grad)" stroke-width="1.8" opacity="0.9" />
    
    <!-- Harmonic Arcs / Dual Wave Resonance -->
    <path d="M 14 32 C 14 22 22 14 32 14 C 42 14 50 22 50 32" stroke="url(#sentinel-grad)" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 50 32 C 50 42 42 50 32 50 C 22 50 14 42 14 32" stroke="url(#sentinel-grad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75" />

    <!-- Wave Interference / Lissajous Nodes -->
    <path d="M 20 32 Q 32 18 44 32 Q 32 46 20 32 Z" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.85" />
    <path d="M 32 20 Q 46 32 32 44 Q 18 32 32 20 Z" stroke="#a855f7" stroke-width="1.5" fill="none" opacity="0.85" />

    <!-- Precision Alignment Ticks (North/South/East/West) -->
    <line x1="32" y1="6" x2="32" y2="10" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="32" y1="54" x2="32" y2="58" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="6" y1="32" x2="10" y2="32" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="54" y1="32" x2="58" y2="32" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Golden Ratio Central Aperture & Focal Spark -->
    <circle cx="32" cy="32" r="6" fill="#090d16" stroke="url(#sentinel-grad)" stroke-width="1.5" />
    <circle cx="32" cy="32" r="3" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="32" cy="32" r="1.5" fill="#ffffff" />
  </g>
</svg>
